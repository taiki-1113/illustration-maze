<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f0dc">
<meta name="description" content="ゆびやマウスでなぞって遊ぶ、10作品のイラスト迷路。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
<title>イラストめいろ</title>
</head>
<body>
<main id="home" class="home paper-frame">
<header class="home-header"><h1>イラストめいろ</h1></header>
<section class="collection" aria-labelledby="collection-title">
<div class="collection-intro">
<div class="collection-heading"><h2 id="collection-title">めいろ一覧</h2><p id="collection-progress">0 / 10 クリア</p></div>
<img class="home-rocket" src="./assets/home-rocket.png" alt="" width="300" height="180">
</div>
<div id="collection-grid" class="collection-grid"></div>
</section>
<div class="end-rule" aria-hidden="true"><i></i></div>
</main>
<section id="play" class="play" aria-labelledby="maze-title" hidden>
<header class="play-header"><a id="collection" href="#home">一覧にもどる</a><h1 id="maze-title"></h1></header>
<div class="stage"><div class="board" id="board"><svg id="maze" viewBox="0 0 760 650" aria-label="迷路" aria-describedby="instruction"></svg></div></div>
<div class="play-controls">
<p id="orientation-note" class="orientation-note" role="status" hidden></p>
<button id="reset" class="reset-button">やりなおす</button>
</div>
<p id="instruction" class="sr-only" role="status"></p>
</section>
<dialog id="success-dialog" aria-labelledby="success-title"><h2 id="success-title">クリア</h2><p id="success-message" hidden></p><button id="next-work" class="primary-button">つぎのめいろ</button><button id="play-again" class="secondary-button">もういちど</button><button id="finish" class="text-button">とじる</button></dialog>
<script type="module" src="./app.js"></script>
</body></html>
