<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf8ef"><meta name="description" content="かわいいかたつむりとカメの迷路。ゆびでなぞって、ゴールまでたどろう。"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><title>イラストめいろ｜かたつむり</title></head>
<body><header class="site-header"><a class="brand" href="#" aria-label="イラストめいろ ホーム"><span class="brand-icon">✿</span> イラスト<span>めいろ</span></a><span class="edition">ちいさな ぼうけん、はじめよう。</span><button id="collection" class="collection-button"><span aria-hidden="true">▦</span> めいろをえらぶ</button></header>
<main><section class="game" aria-labelledby="maze-title"><div class="heading"><div><p class="eyebrow">いきものの めいろ <span>01</span></p><h1 id="maze-title">かたつむりの<span class="title-break"> めいろ</span></h1></div><span id="clear-badge" class="clear-badge" hidden>✓ クリアずみ</span></div><div class="instruction"><span class="hand" aria-hidden="true">☝</span><p id="instruction">スタートから ゆびで なぞってみよう！</p></div><div class="board"><svg id="maze" viewBox="0 0 760 650" role="img" aria-label="かたつむりの迷路。左下のスタートから右のゴールまで、道をなぞって進みます。"></svg></div><div class="game-bottom"><p class="tip"><span class="tip-dot"></span>ゆびを はなしても、つづきから あそべるよ</p><button id="reset" class="reset-button"><span aria-hidden="true">↻</span> やりなおす</button></div><p class="keyboard-note">パソコンでは マウスで なぞれるよ。<br class="mobile-only">キーボードは Enter ではじめて、やじるしキーで すすもう。</p></section><footer><span class="footer-flower">✿</span> あせらず、じぶんの ペースで。 <span class="footer-flower small">✦</span></footer></main>
<dialog id="collection-dialog"><button class="dialog-close" aria-label="とじる">×</button><p class="eyebrow">イラストめいろ</p><h2>すきな めいろで あそぼう</h2><p id="collection-progress" class="dialog-description">0 / 2 クリア</p><div class="collection-grid"><button id="snail-card" class="snail-card"><svg id="thumbnail" viewBox="0 0 760 650" aria-hidden="true"></svg><strong>かたつむり</strong><span class="card-status">あそぶ →</span></button><button id="turtle-card" class="snail-card"><svg viewBox="0 0 760 650" aria-hidden="true"></svg><strong>かめ</strong><span class="card-status">あそぶ →</span></button></div><p class="collection-note">あたらしい めいろも、おたのしみに。</p></dialog>
<dialog id="success-dialog"><div class="celebration" aria-hidden="true">✦ <span>♛</span> ✦</div><p class="eyebrow">やったね！</p><h2>ゴール おめでとう！</h2><p id="success-message">さいごまで たどりつけたね。<br>かたつむりも うれしそう！</p><button id="next-work" class="primary-button">つぎの めいろへ →</button><button id="play-again" class="secondary-button">もういちど あそぶ <span>↻</span></button><button id="finish" class="text-button">めいろを みる</button></dialog><script type="module" src="./app.js"></script></body></html>
